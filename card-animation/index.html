<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanji card animation</title>
<!-- A 10-second loop of the kanji card, in the app's own design tokens:
     card → colour-coded phrases → phrase sheet → word sheet → mark as learned → progress. -->
<style>
:root { --bg:#f9f7fd; --card:#fff; --ink:#1d1b18; --muted:#6b665e; --line:#eae6f7; --brand:#310a3e; --brand-soft:#eae6f7;
        --tag:#eee9f0; --tag-ink:#6b665e; --light-gray:#f7f7f7; --learn-on:#9bd8a8; --learn-ink:#1d5631; --read-tint:#f5f3fc;
        --hover-line:#bba6ee; --hover-strong:#8f72dc; --particle:#e58900; --verb:#16aa6f;
        --shadow:0 4px 24px rgba(26,20,77,.12); --soft-shadow:0 1px 2px rgba(49,10,62,.06), 0 2px 8px rgba(49,10,62,.06); }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
html, body { background:transparent; }
body { display:flex; align-items:center; justify-content:center; overflow:hidden;
       font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif; color:var(--ink); line-height:1.5; }
.stage { width:390px; height:800px; transform-origin:center; }
.phone { position:relative; width:390px; height:800px; border-radius:48px; background:var(--bg); overflow:hidden;
         box-shadow:0 0 0 10px #1d1b18, 0 30px 80px rgba(26,20,77,.25); }
.screen { position:absolute; inset:0; padding:22px 16px 16px; display:flex; flex-direction:column; gap:14px; }

/* top: where this card sits in the deck (same as the app: no fill, no percentage) */
.top { display:flex; align-items:center; gap:12px; }
.position { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
.position-label { font-size:12px; font-weight:700; letter-spacing:.02em; color:var(--brand); }
.position-track { position:relative; height:10px; }
.position-track::before { content:""; position:absolute; left:0; right:0; top:3px; height:4px; border-radius:2px; background:var(--brand-soft); }
.position-dot { position:absolute; top:0; width:10px; height:10px; border-radius:50%; background:var(--brand); }
.close { flex:none; width:36px; height:36px; border-radius:50%; background:var(--card); box-shadow:inset 0 0 0 1px var(--line), var(--soft-shadow);
         display:flex; align-items:center; justify-content:center; }

/* card */
.card { position:relative; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px 18px; box-shadow:var(--soft-shadow);
        display:flex; flex-direction:column; gap:14px; }
.head { display:flex; gap:16px; }
.kanji { font-size:92px; line-height:1; font-weight:500; }
.info { flex:1; display:flex; flex-direction:column; gap:5px; padding-top:2px; }
.lv { align-self:flex-start; font-size:11px; font-weight:700; padding:1px 8px; border-radius:999px; background:var(--tag); color:var(--tag-ink); }
.meaning { font-size:17px; font-weight:700; line-height:1.25; }
.rrow { display:grid; grid-template-columns:34px 1fr auto; font-size:13px; align-items:baseline; }
.rl { font-size:12px; color:var(--muted); } .ro { font-size:12px; color:var(--muted); }
.learn { position:absolute; top:16px; right:16px; width:26px; height:26px; }
.learn circle { fill:var(--card); stroke:var(--hover-line); stroke-width:1.5; transition:fill .25s, stroke .25s; }
.learn path { stroke:var(--hover-line); transition:stroke .25s; }
.learn.on circle { fill:var(--learn-on); stroke:var(--learn-on); }
.learn.on path { stroke:#fff; }
.learn.on { animation:pop .35s ease-out; }
@keyframes pop { 40% { transform:scale(1.3); } }

.sec { border-radius:12px; overflow:hidden; border:1px solid var(--line); }
.sec-h { display:flex; justify-content:space-between; padding:7px 12px; background:var(--read-tint);
         font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--brand); }
.rads { display:flex; gap:6px; padding:10px; }
.rad { display:flex; align-items:center; gap:6px; padding:4px 10px; border:1px solid var(--line); border-radius:999px; font-size:11px; color:var(--muted); }
.rad b { font-size:17px; font-weight:400; color:var(--ink); }
.vocab { padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px; }
.word { padding-left:10px; border-left:2px solid var(--brand-soft); }
.word-ja { font-size:20px; font-weight:700; } .word-r { font-size:13px; color:var(--muted); margin-left:6px; } .word-en { font-size:13px; color:var(--muted); }
.ph-box { border:2px solid var(--light-gray); border-radius:10px; overflow:hidden; }
.ph-h { padding:4px 10px; background:var(--light-gray); font-size:10px; font-weight:700; letter-spacing:.08em; color:var(--brand); }
.ph { padding:6px 8px; margin:3px; border-radius:10px; transition:background .2s; }
.ph.tap { background:var(--read-tint); }
.ph-ja { font-size:16px; } .ph-en { font-size:13px; color:var(--muted); }
.pt { color:var(--particle); } .vb { color:var(--verb); }
.pt, .vb { display:inline-block; transition:transform .25s; }
.colours .pt, .colours .vb { animation:glow .9s ease-in-out; }
@keyframes glow { 45% { transform:translateY(-3px) scale(1.18); } }

.nav { margin-top:auto; display:flex; justify-content:center; gap:24px; }
.nbtn { width:44px; height:44px; border-radius:50%; background:var(--card); box-shadow:inset 0 0 0 1px var(--line), var(--soft-shadow);
        display:flex; align-items:center; justify-content:center; }

.sl { display:flex; align-items:center; gap:8px; }
.chev { transform:rotate(-90deg); transition:transform .25s; }
.sec-h { transition:background .2s; }
.sec-h.tap { background:var(--brand-soft); }
.vocab-wrap { display:grid; grid-template-rows:0fr; transition:grid-template-rows .45s cubic-bezier(.3,.8,.3,1); }
.vocab-wrap > .vocab { overflow:hidden; min-height:0; padding-top:0; padding-bottom:0; transition:padding .45s; }
.vocab-wrap.open { grid-template-rows:1fr; }
.vocab-wrap.open > .vocab { padding-top:10px; padding-bottom:12px; }
.open-chev .chev { transform:none; }
.word-ja { border-radius:6px; padding:0 2px; margin:0 -2px; transition:background .2s; }
.word-ja.tap { background:var(--brand-soft); }


/* sheets */
.scrim { position:absolute; inset:0; background:rgba(26,20,77,.35); opacity:0; transition:opacity .3s; pointer-events:none; }
.scrim.on { opacity:1; }
.sheet { position:absolute; left:0; right:0; bottom:0; padding:12px 24px 34px; background:var(--card); border-radius:20px 20px 0 0;
         text-align:center; transform:translateY(105%); transition:transform .35s cubic-bezier(.25,.9,.3,1); }
.sheet.on { transform:none; }
.handle { display:block; width:40px; height:4px; margin:0 auto; border-radius:2px; background:var(--brand-soft); }
.s-btn { position:absolute; top:12px; width:36px; height:36px; border-radius:50%; background:var(--card);
         box-shadow:inset 0 0 0 1px var(--line), var(--soft-shadow); display:flex; align-items:center; justify-content:center; }
.s-close { right:12px; } .s-back { left:12px; }
.s-word { margin:28px 0 2px; font-size:28px; line-height:2; }
.s-word rt { font-size:12px; color:var(--muted); }
.s-word.big { font-size:46px; font-weight:700; line-height:1.6; } .s-word.big rt { font-size:16px; }
.s-mean { margin:0 0 16px; font-size:16px; color:var(--muted); }
.wbtn { border-radius:6px; padding:0 2px; transition:background .2s; }
.wbtn.tap { background:var(--brand-soft); }
.play { position:relative; width:46px; height:46px; margin:0 auto; border-radius:50%; background:var(--card);
        box-shadow:inset 0 0 0 1px var(--line), var(--soft-shadow); display:flex; align-items:center; justify-content:center; }
.play::before, .play::after { content:""; position:absolute; inset:0; border-radius:50%; border:2px solid var(--hover-line); opacity:0; }
.play.sound::before { animation:ring 1s ease-out; } .play.sound::after { animation:ring 1s .3s ease-out; }
@keyframes ring { from { transform:scale(1); opacity:.9; } to { transform:scale(1.9); opacity:0; } }
.hint { margin:14px 0 0; font-size:12px; color:var(--muted); }

/* toast */
.toast { position:absolute; left:50%; bottom:92px; display:flex; align-items:center; gap:8px; padding:9px 16px 9px 12px;
         border-radius:999px; background:var(--brand); color:#fff; font-size:13px; font-weight:700; white-space:nowrap;
         opacity:0; transform:translate(-50%, 10px); transition:opacity .25s, transform .25s; }
.toast.on { opacity:1; transform:translate(-50%, 0); }

/* finger */
.finger { position:absolute; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%; background:rgba(49,10,62,.18);
          border:2px solid rgba(255,255,255,.9); box-shadow:0 2px 10px rgba(26,20,77,.25); opacity:0; pointer-events:none;
          transition:left .45s cubic-bezier(.4,0,.2,1), top .45s cubic-bezier(.4,0,.2,1), opacity .25s, transform .15s; z-index:5; }
.finger.on { opacity:1; }
.finger.press { transform:scale(.8); background:rgba(49,10,62,.32); }

.fade { position:absolute; inset:0; border-radius:48px; background:var(--bg); opacity:0; transition:opacity .35s; pointer-events:none; z-index:6; }
.fade.on { opacity:1; }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="stage" id="stage"><div class="phone" id="phone">
<div class="screen">
  <div class="top">
    <div class="position"><span class="position-label">30 of 79</span>
      <div class="position-track"><span class="position-dot" style="left:calc((100% - 10px) * 0.3718)"></span></div></div>
    <div class="close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="#310A3E" stroke-width="2"/></svg></div>
  </div>
  <article class="card">
    <svg class="learn" id="learn" viewBox="0 0 28 28"><circle cx="14" cy="14" r="13.25"/><path d="M8.5 14.5l3.5 3.5 7.5-8" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="head">
      <div class="kanji" lang="ja">学</div>
      <div class="info">
        <span class="lv">N5</span>
        <div class="meaning">study, learning, science</div>
        <div>
          <div class="rrow"><span class="rl">On</span><span lang="ja">ガク</span><span class="ro">gaku</span></div>
          <div class="rrow"><span class="rl">Kun</span><span lang="ja">まな.ぶ</span><span class="ro">manabu</span></div>
        </div>
      </div>
    </div>
    <div class="sec"><div class="sec-h"><span>Radicals</span><span>3</span></div>
      <div class="rads"><span class="rad"><b>冖</b>crown</span><span class="rad"><b>子</b>child</span><span class="rad"><b>⺍</b>little</span></div></div>
    <div class="sec"><div class="sec-h" id="vocab-h"><span class="sl"><svg class="chev" width="10" height="10" viewBox="0 0 10 10"><path d="M2.5 3.8L5 6.3l2.5-2.5" fill="none" stroke="#310A3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Vocabulary · N5</span><span>4</span></div>
      <div class="vocab-wrap" id="vocab"><div class="vocab">
        <div class="word"><span class="word-ja" id="v-gakusei" lang="ja">学生</span><span class="word-r">がくせい</span><div class="word-en">student</div></div>
        <div class="ph-box" id="phrases"><div class="ph-h">PHRASES</div>
          <div class="ph" id="ph1"><div class="ph-ja" lang="ja">学生<span class="vb">です</span>。</div><div class="ph-en">I am a student.</div></div>
          <div class="ph" id="ph2"><div class="ph-ja" lang="ja">学生<span class="vb">な</span><span class="pt">の</span>？</div><div class="ph-en">Are you a student?</div></div>
        </div>
        <div class="word"><span class="word-ja" lang="ja">学校</span><span class="word-r">がっこう</span><div class="word-en">school</div></div>
      </div></div>
    </div>
  </article>
  <nav class="nav"><span class="nbtn"><svg width="14" height="14" viewBox="0 0 10 10"><path d="M6.5 1.5L3 5l3.5 3.5" fill="none" stroke="#310A3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="nbtn"><svg width="14" height="14" viewBox="0 0 10 10"><path d="M3.5 1.5L7 5 3.5 8.5" fill="none" stroke="#310A3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></nav>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet-ph"><span class="handle"></span>
  <span class="s-btn s-close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="#310A3E" stroke-width="2"/></svg></span>
  <p class="s-word" id="ph-word" lang="ja"><span class="wbtn" id="w-gakusei"><ruby>学<rt>がく</rt></ruby><ruby>生<rt>せい</rt></ruby></span><span class="vb">な</span><span class="pt">の</span>？</p>
  <p class="s-mean">Are you a student?</p>
  <div class="play" id="play1"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.6" fill="none" stroke="#310A3E" stroke-width="1.6"/><path d="M8.2 6.6v6.8l5.2-3.4z" fill="#310A3E"/></svg></div>
  <p class="hint">Tap a word to see it on its own.</p>
</div>
<div class="sheet" id="sheet-w"><span class="handle"></span>
  <span class="s-btn s-back" id="w-back"><svg width="14" height="14" viewBox="0 0 10 10"><path d="M6.5 1.5L3 5l3.5 3.5" fill="none" stroke="#310A3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span class="s-btn s-close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="#310A3E" stroke-width="2"/></svg></span>
  <p class="s-word big" lang="ja"><ruby>学生<rt>がくせい</rt></ruby></p>
  <p class="s-mean">student</p>
  <div class="play" id="play2"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.6" fill="none" stroke="#310A3E" stroke-width="1.6"/><path d="M8.2 6.6v6.8l5.2-3.4z" fill="#310A3E"/></svg></div>
</div>
<div class="toast" id="toast"><svg width="18" height="18" viewBox="0 0 28 28"><circle cx="14" cy="14" r="14" fill="#9bd8a8"/><path d="M8.5 14.5l3.5 3.5 7.5-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Marked as learned</div>
<div class="finger" id="finger"></div>
<div class="fade" id="fade"></div>
</div></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const phone = $("phone"), finger = $("finger");
  // Fit the phone to the window
  const fit = () => { const s = Math.min(1, (innerHeight - 40) / 820, (innerWidth - 40) / 410); $("stage").style.transform = `scale(${s})`; };
  addEventListener("resize", fit); fit();

  const on = (id, v = true) => $(id).classList.toggle("on", v);
  const center = id => { const p = phone.getBoundingClientRect(), r = $(id).getBoundingClientRect(), s = p.width / 390;
                         return [(r.left + r.width / 2 - p.left) / s, (r.top + r.height / 2 - p.top) / s]; };
  const move = id => { const [x, y] = center(id); finger.style.left = x + "px"; finger.style.top = y + "px"; };
  const press = () => { finger.classList.add("press"); setTimeout(() => finger.classList.remove("press"), 160); };
  const sound = id => { $(id).classList.remove("sound"); void $(id).offsetWidth; $(id).classList.add("sound"); };

  const tap = (id, cls = "tap") => { press(); $(id).classList.add(cls); };
  const reset = () => {
    ["scrim", "sheet-ph", "sheet-w", "toast", "finger", "learn"].forEach(id => on(id, false));
    ["ph2", "w-gakusei", "v-gakusei", "vocab-h"].forEach(id => $(id).classList.remove("tap"));
    $("vocab").classList.remove("open"); $("vocab-h").classList.remove("open-chev"); $("ph-word").classList.remove("colours");
    finger.style.left = "300px"; finger.style.top = "700px";
  };
  // [ms, step]: one 10-second loop
  const T = [
    [150,  () => on("fade", false)],
    [350,  () => { on("finger"); move("vocab-h"); }],
    [800,  () => { tap("vocab-h"); $("vocab").classList.add("open"); $("vocab-h").classList.add("open-chev"); }],
    [1050, () => $("vocab-h").classList.remove("tap")],
    [1700, () => move("v-gakusei")],
    [2100, () => { tap("v-gakusei"); $("w-back").hidden = true; }],  // a word
    [2300, () => { on("scrim"); on("sheet-w"); }],
    [2650, () => sound("play2")],
    [3500, () => { on("sheet-w", false); on("scrim", false); $("v-gakusei").classList.remove("tap"); }],
    [3850, () => move("ph2")],
    [4250, () => tap("ph2")],                                         // a phrase
    [4450, () => { on("scrim"); on("sheet-ph"); }],
    [4850, () => $("ph-word").classList.add("colours")],             // particles and verbs pop
    [5600, () => sound("play1")],
    [6700, () => { on("sheet-ph", false); on("scrim", false); }],
    [7000, () => { $("ph2").classList.remove("tap"); move("learn"); }],
    [7450, () => { press(); on("learn"); on("toast"); }],
    [7700, () => on("finger", false)],
    [8900, () => on("toast", false)],
    [9650, () => on("fade")],
  ];
  let timers = [];
  const run = () => { timers.forEach(clearTimeout); reset(); timers = T.map(([t, f]) => setTimeout(f, t)); timers.push(setTimeout(run, 10000)); };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { on("fade", false); $("vocab").classList.add("open"); $("vocab-h").classList.add("open-chev"); on("learn"); }
  else run();
})();
</script>
</body>
</html>
