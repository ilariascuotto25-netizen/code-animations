<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figma Make Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  /* Built from the portfolio-hover-flick template, recomposed in the promo-sticker style */
  :root {
    --purple: #6361f0;
    --ink: #1d1b3a;
    --sticker-shadow: 0 1px 2px rgba(29,27,58,.06), 0 14px 34px -10px rgba(52,40,140,.28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "DM Sans", system-ui, sans-serif; font-variation-settings: "opsz" 14; -webkit-font-smoothing: antialiased; cursor: default; }
  #stage { position: absolute; left: 50%; top: 50%; width: 979px; height: 669px; transform-origin: 0 0; }
  .layer { position: absolute; inset: 0; will-change: transform; pointer-events: none; }
  .card { position: absolute; will-change: transform; }
  .float { width: 100%; height: 100%; will-change: transform; }

  /* Soft glow behind the group */
  .glow {
    position: absolute; left: 126px; top: 106px; width: 700px; height: 490px; border-radius: 50%;
    background:
      radial-gradient(closest-side at 42% 50%, rgba(160,150,255,.55), rgba(160,150,255,0) 100%),
      radial-gradient(closest-side at 70% 45%, rgba(120,190,255,.35), rgba(120,190,255,0) 100%);
    filter: blur(24px);
  }

  /* Sticker surface: white card, hairline, lifted shadow */
  .sticker {
    width: 100%; height: 100%; background: #fff; border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(99,97,240,.14); box-shadow: var(--sticker-shadow);
  }
  .sticker img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* Positions (stage px). Rotations at rest give the fanned promo look. */
  #spec     { left: 78px;   top: 144px; width: 340px; height: 140px; }
  #chat     { left: 584px;  top: 412px; width: 300px; height: 119px; }
  #hero     { left: 196px;  top: 266px; width: 560px; height: 166px; }
  #hero .sticker { border-radius: 22px; box-shadow: 0 2px 4px rgba(29,27,58,.06), 0 10px 24px -12px rgba(29,27,58,.18); }
  /* The hero's purple shadow lives on its own layer behind every card, so it never paints over the images */
  #hero-shadow { left: 216px; top: 300px; width: 520px; height: 150px; }
  #hero-shadow .blob { width: 100%; height: 100%; border-radius: 40px; background: rgba(82,64,200,.42); filter: blur(28px); }
  #selected { left: 610px;  top: 192px; width: 320px; height: 79px; }
  #selected .sticker { border-radius: 12px; }
  #toolbar  { left: 626px;  top: 134px; width: 240px; height: 39px; }
  #toolbar .sticker { border-radius: 999px; }
  #tooltip  { position: absolute; left: 137px; top: 41px; width: 40px; height: 25px; border-radius: 5px; overflow: hidden; box-shadow: 0 6px 14px -4px rgba(0,0,0,.35); }
  #tooltip img { width: 100%; height: 100%; display: block; }
  #cursor   { position: absolute; left: 175px; top: 29px; width: 30px; height: 30px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
  #logo     { left: 70px;   top: 334px; width: 150px; height: 100px; }
  #logo .sticker { border-radius: 22px; }
  #ai {
    left: 248px;  top: 456px; height: 40px; width: 92px;
  }
  .pill {
    width: 100%; height: 100%; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: linear-gradient(135deg, #7c5cff, #6361f0 55%, #4f46e5);
    color: #fff; font-weight: 700; font-size: 18px; letter-spacing: .01em;
    box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 14px 30px -8px rgba(79,70,229,.6);
  }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Figma Make research collage: the 'What do you want to make?' prompt surrounded by a component spec, a chat with pasted frames, an edit toolbar, a selected element and the Figma Make logo.">

  <div class="glow" aria-hidden="true"></div>

  <!-- hero shadow (behind everything) -->
  <div class="layer" id="L-hshadow"><div class="card" id="hero-shadow"><div class="blob"></div></div></div>

  <!-- back cards -->
  <div class="layer" id="L-spec"><div class="card" id="spec"><div class="float"><div class="sticker"><img src="assets/spec.png" alt=""></div></div></div></div>
  <div class="layer" id="L-chat"><div class="card" id="chat"><div class="float"><div class="sticker"><img src="assets/chat.png" alt=""></div></div></div></div>

  <!-- hero -->
  <div class="layer" id="L-hero"><div class="card" id="hero"><div class="float"><div class="sticker"><img src="assets/prompt.png" alt=""></div></div></div></div>

  <!-- floating stickers -->
  <div class="layer" id="L-selected"><div class="card" id="selected"><div class="float"><div class="sticker"><img src="assets/selected.png" alt=""></div></div></div></div>
  <div class="layer" id="L-logo"><div class="card" id="logo"><div class="float"><div class="sticker"><img src="assets/figma-make-logo.png" alt=""></div></div></div></div>
  <div class="layer" id="L-ai"><div class="card" id="ai"><div class="float"><div class="pill">✦ AI</div></div></div></div>
  <div class="layer" id="L-toolbar">
    <div class="card" id="toolbar">
      <div class="float" style="position:relative">
        <div class="sticker"><img src="assets/toolbar.png" alt=""></div>
        <div id="tooltip"><img src="assets/tooltip.png" alt=""></div>
        <svg id="cursor" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2.5 L4 19 L8.6 14.9 L11.6 21.4 L14.6 20 L11.7 13.6 L18 13.3 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  // ============================================================
  // CONFIG
  // ============================================================
  // Rest rotations give the fanned "promo" composition; hover pushes the fan further open.
  const REST = {
    '#spec': -5, '#chat': 4.5, '#hero': 0, '#selected': 3.5, '#toolbar': -3, '#logo': -8, '#ai': -6,
  };
  Object.entries(REST).forEach(([sel, r]) => gsap.set(sel, { rotate: r }));

  const CONFIG = {
    frame: { w: 979, h: 669 },
    margin: 0.9,
    ease: 'back.out(2.1)',
    duration: 0.65,
    leaveSpeed: 1.5,
    cards: [
      // Back cards tip outward, away from the hero
      { el: '#spec',  layer: '#L-spec',  origin: '80% 80%', hover: { x: -26, y: -16, rotate: -10, scale: 0.97 }, depth: -10, lean: 1.5 },
      { el: '#chat',  layer: '#L-chat',  origin: '20% 20%', hover: { x: 24,  y: 18,  rotate: 9,   scale: 0.97 }, depth: -10, lean: 1.5 },
      // Hero lifts toward the viewer
      { el: '#hero-shadow', layer: '#L-hshadow', origin: '50% 50%', hover: { x: 0, y: 16, rotate: 0, scale: 1.14 }, depth: 14, lean: 1 },
      { el: '#hero',  layer: '#L-hero',  origin: '50% 50%', hover: { x: 0,   y: -6,  rotate: 0,   scale: 1.04 }, depth: 14,  lean: 1 },
      // Stickers pop outward with extra spin; they sit closest, so they move most with the pointer
      { el: '#selected', layer: '#L-selected', origin: '20% 50%', hover: { x: 20,  y: -12, rotate: 7,   scale: 1.06 }, depth: 26, lean: 2.5 },
      { el: '#toolbar',  layer: '#L-toolbar',  origin: '30% 50%', hover: { x: 14,  y: -18, rotate: -6,  scale: 1.06 }, depth: 34, lean: 3 },
      { el: '#logo',     layer: '#L-logo',     origin: '80% 50%', hover: { x: -22, y: 12,  rotate: -13, scale: 1.08 }, depth: 30, lean: -3 },
      { el: '#ai',       layer: '#L-ai',       origin: '50% 50%', hover: { x: -12, y: 18,  rotate: -11, scale: 1.12 }, depth: 40, lean: -3 },
    ],
    extras(tl) {
      // The cursor glides onto the "Edit" icon, presses, and the tooltip pops
      tl.fromTo('#cursor', { x: 26, y: 18, rotate: 0 }, { x: 0, y: 0, duration: 0.45, ease: 'power3.out' }, 0.05)
        .to('#cursor', { keyframes: { scale: [1, 0.82, 1] }, duration: 0.22, ease: 'power1.inOut' }, 0.42)
        .fromTo('#tooltip', { opacity: 0, y: -4, scale: 0.7, transformOrigin: '50% 0%' },
                            { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: 'back.out(3)' }, 0.48)
      // Hero shadow deepens as it lifts
        .fromTo('#hero-shadow .blob', { opacity: 0.75 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0)
      // The glow swells
        .fromTo('.glow', { scale: 1, opacity: 1 }, { scale: 1.08, opacity: 1, duration: 0.6, ease: 'power2.out' }, 0);
    },
  };

  // ============================================================
  // ENGINE — reusable, no edits needed
  // ============================================================
  const { w: W, h: H } = CONFIG.frame;
  const stage = document.getElementById('stage');
  const params = new URLSearchParams(location.search);

  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H) * CONFIG.margin;
    stage.style.transform = `translate(${-W * s / 2}px, ${-H * s / 2}px) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  // Layers pivot around their card's centre for the pointer lean
  function pivotLayers() {
    CONFIG.cards.forEach((c) => {
      const el = document.querySelector(c.el);
      const cx = el.offsetLeft + el.offsetWidth / 2, cy = el.offsetTop + el.offsetHeight / 2;
      gsap.set(c.layer, { transformOrigin: `${cx}px ${cy}px` });
      gsap.set(c.el, { transformOrigin: c.origin || '50% 50%' });
      if (c.shadow) gsap.set(c.el, { filter: c.shadow.rest });
    });
  }
  pivotLayers();

  const tl = gsap.timeline({ paused: true });
  CONFIG.cards.forEach((c, i) => {
    tl.to(c.el, { ...c.hover, duration: CONFIG.duration, ease: CONFIG.ease }, i * 0.03);
    if (c.shadow) tl.to(c.el, { filter: c.shadow.hover, duration: CONFIG.duration - 0.15, ease: 'power2.out' }, i * 0.03);
  });
  CONFIG.extras(tl);

  const open = () => tl.timeScale(1).play();
  const close = () => tl.timeScale(CONFIG.leaveSpeed).reverse();

  // Pointer parallax + lean (eased follow)
  const q = CONFIG.cards.map((c) => ({
    c,
    x: gsap.quickTo(c.layer, 'x', { duration: 0.6, ease: 'power3.out' }),
    y: gsap.quickTo(c.layer, 'y', { duration: 0.6, ease: 'power3.out' }),
    r: gsap.quickTo(c.layer, 'rotate', { duration: 0.8, ease: 'power3.out' }),
  }));
  function follow(e) {
    const nx = e.clientX / innerWidth - 0.5, ny = e.clientY / innerHeight - 0.5;   // -0.5…0.5
    q.forEach(({ c, x, y, r }) => { x(nx * c.depth); y(ny * c.depth); r(nx * c.lean); });
  }
  const settle = () => q.forEach(({ x, y, r }) => { x(0); y(0); r(0); });

  const root = document.documentElement;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (params.has('open')) {
    tl.progress(1);
  } else if (reduced) {
    root.addEventListener('pointerenter', () => tl.progress(1));
    root.addEventListener('pointerleave', () => tl.progress(0));
  } else {
    root.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') open(); });
    root.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { close(); settle(); } });
    root.addEventListener('pointermove',  (e) => { if (e.pointerType === 'mouse') follow(e); });
    // Backup for browsers that miss pointerleave on fast exits from an iframe
    document.addEventListener('mouseout', (e) => { if (!e.relatedTarget) { close(); settle(); } });
    // Touch has no hover: a tap toggles
    root.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'mouse') (tl.reversed() || tl.progress() === 0) ? open() : close();
    });
    // A host page can forward its own hover state: postMessage('hover:on' | 'hover:off')
    addEventListener('message', (e) => { if (e.data === 'hover:on') open(); if (e.data === 'hover:off') { close(); settle(); } });
  }
  if (params.has('t')) tl.pause().progress(parseFloat(params.get('t')));
  window.__tl = tl;
  window.__cfg = CONFIG;

  // ---------- Idle float at rest: each card bobs gently, out of phase ----------
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !params.has('open') && !params.has('t')) {
    gsap.utils.toArray('.float').forEach((el, i) => {
      gsap.to(el, {
        y: i % 2 ? 4 : -4, rotate: i % 2 ? 0.6 : -0.6,
        duration: 2.6 + (i % 4) * 0.4, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: i * 0.23,
      });
    });
  }
})();
</script>
</body>
</html>
