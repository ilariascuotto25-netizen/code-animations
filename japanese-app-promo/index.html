<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Japanese Kanji promo</title>
<style>
  /* ============================================================
     PROMO COLLAGE: the Japanese kanji app (promo-graphic.png, animated)
     Hero: the 学 card with its AI memory story. Back cards: the N5 grid and the
     Meaning quiz with "Why?". Stickers: 字 tile, phrase, ✦ AI, Correct!, ▶,
     and Figma + Claude Code underneath.
     Motion: idle float → hover fans the collage open → pointer parallax.
     Anything purple/blurred lives on its own layer behind the cards; only
     transform and opacity animate.
     ============================================================ */
  :root {
    --ink: #1d1b18; --muted: #6b665e; --line: #eae6f7; --brand: #310a3e;
    --learn-on: #9bd8a8; --learn-ink: #1d5631; --particle: #e58900; --verb: #16aa6f; --ai: #8a2be2;
    --sticker-shadow: 0 1px 3px rgba(29,27,58,.10), 0 18px 40px -10px rgba(40,30,110,.42);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink); cursor: default; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1160px; height: 1140px; transform-origin: 0 0; }
  .layer { position: absolute; inset: 0; will-change: transform; pointer-events: none; }
  .card { position: absolute; will-change: transform; }
  .float { width: 100%; height: 100%; will-change: transform; }

  .glow { position: absolute; left: 150px; top: 150px; width: 860px; height: 860px; border-radius: 50%;
          background: radial-gradient(circle, rgba(187,166,238,.55), rgba(243,232,255,.35) 45%, rgba(249,247,253,0) 70%); }

  /* Phones: the app screens exported from Figma, in a dark bezel (static shadow) */
  .phone { width: 100%; height: 100%; overflow: hidden; background: #f9f7fd; }
  .phone img { display: block; width: 100%; }
  #hero .phone   { border-radius: 49px; box-shadow: 0 0 0 11px #1d1b18, 0 10px 24px -12px rgba(29,27,58,.3); }
  .back .phone   { border-radius: 42px; box-shadow: 0 0 0 9px #1d1b18, var(--sticker-shadow); }
  #hero-shadow .blob { width: 100%; height: 100%; border-radius: 60px; background: rgba(60,30,120,.40); filter: blur(34px); }

  /* Sticker surfaces */
  .tile { width: 100%; height: 100%; background: #fff; border: 1px solid var(--line); box-shadow: var(--sticker-shadow); }
  .kanji { position: relative; border-radius: 36px; display: flex; align-items: center; justify-content: center; font-size: 96px; }
  .kanji .badge { position: absolute; top: -12px; right: -12px; width: 42px; height: 42px; border-radius: 50%; line-height: 0;
                  box-shadow: 0 0 0 4px #fff, 0 2px 6px rgba(29,27,58,.15); }
  .phrase { border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 42px; padding-top: 6px; }
  .phrase .vb { color: var(--verb); } .phrase .pt { color: var(--particle); }
  .phrase rt { font-size: 15px; color: var(--muted); }
  .pill { width: 100%; height: 100%; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 10px;
          background: var(--ai); color: #fff; font-size: 27px; font-weight: 700;
          box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 14px 30px -8px rgba(138,43,226,.6); }
  .correct { border-radius: 999px; display: flex; align-items: center; gap: 12px; padding: 0 26px 0 16px; background: #e8f6ec;
             border: 2px solid var(--learn-on); color: var(--learn-ink); font-size: 30px; font-weight: 700; }
  .play { position: relative; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .ring { position: absolute; border-radius: 50%; border: 2px solid #bba6ee; pointer-events: none; }
  .ring.r1 { inset: -16px; opacity: .6; } .ring.r2 { inset: -34px; opacity: .3; }
  .tool { border-radius: 28px; display: flex; align-items: center; gap: 14px; padding: 0 26px 0 12px; font-size: 28px; font-weight: 700; white-space: nowrap; }
  .tool .ic { position: relative; flex: none; width: 72px; height: 72px; }
  .tool .ic img { width: 72px; height: 72px; border-radius: 18px; display: block; }
  .tool .term { position: absolute; right: -9px; bottom: -7px; padding: 1px 8px; border-radius: 999px; background: var(--brand); color: #fff;
                font: 700 15px/1.3 ui-monospace, Menlo, monospace; border: 3px solid #fff; }
  .plus { width: 100%; height: 100%; border-radius: 50%; background: var(--brand); display: flex; align-items: center; justify-content: center;
          box-shadow: var(--sticker-shadow); }

  /* ---- Positions (stage px), from promo-graphic.html ---- */
  #hero-shadow { left: 374px; top: 170px; width: 330px; height: 780px; }
  #hero        { left: 354px; top: 130px; width: 368px; height: 796px; }
  #back-a      { left: 140px; top: 265px; width: 315px; height: 682px; }
  #back-b      { left: 615px; top: 265px; width: 315px; height: 682px; }
  #s-kanji     { left: 120px; top: 46px;  width: 150px; height: 150px; }
  #s-phrase    { left: 740px; top: 66px;  width: 300px; height: 100px; }
  #s-ai        { left: 478px; top: 26px;  width: 104px; height: 56px; }
  #s-correct   { left: 900px; top: 690px; width: 230px; height: 70px; }
  #s-play      { left: 46px;  top: 720px; width: 104px; height: 104px; }
  #s-figma     { left: 262px; top: 1000px; width: 218px; height: 96px; }
  #s-plus      { left: 502px; top: 1022px; width: 52px;  height: 52px; }
  #s-claude    { left: 578px; top: 1000px; width: 320px; height: 96px; }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Learn Japanese Kanji: the kanji card with an AI memory story, the N5 grid and a quiz, designed in Figma and built with Claude Code">

  <div class="glow" aria-hidden="true"></div>

  <!-- DOM order = paint order: hero shadow, back cards, hero, stickers -->
  <div class="layer" id="L-hshadow"><div class="card" id="hero-shadow"><div class="blob"></div></div></div>

  <div class="layer" id="L-back-a"><div class="card back" id="back-a"><div class="float"><div class="phone"><img src="assets/grid.png" alt=""></div></div></div></div>
  <div class="layer" id="L-back-b"><div class="card back" id="back-b"><div class="float"><div class="phone"><img src="assets/quiz-why.png" alt=""></div></div></div></div>

  <div class="layer" id="L-hero"><div class="card" id="hero"><div class="float"><div class="phone"><img src="assets/card-story.png" alt=""></div></div></div></div>

  <div class="layer" id="L-kanji"><div class="card" id="s-kanji"><div class="float"><div class="tile kanji" lang="ja">字<span class="badge" id="kanji-check"><svg width="42" height="42" viewBox="0 0 28 28"><circle cx="14" cy="14" r="14" fill="#9bd8a8"/><path d="M8.5 14.5l3.5 3.5 7.5-8" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div></div></div></div>
  <div class="layer" id="L-phrase"><div class="card" id="s-phrase"><div class="float"><div class="tile phrase" lang="ja"><ruby>学生<rt>がくせい</rt></ruby><span class="vb">です</span><span class="pt">か</span>？</div></div></div></div>
  <div class="layer" id="L-ai"><div class="card" id="s-ai"><div class="float"><div class="pill"><svg width="22" height="22" viewBox="0 0 10 10"><path d="M5 0c.4 2.6 1.4 3.6 5 5-3.6 1.4-4.6 2.4-5 5-.4-2.6-1.4-3.6-5-5 3.6-1.4 4.6-2.4 5-5z" fill="#fff"/></svg>AI</div></div></div></div>
  <div class="layer" id="L-correct"><div class="card" id="s-correct"><div class="float"><div class="tile correct"><svg id="correct-check" width="34" height="34" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#3f9a5b"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Correct!</div></div></div></div>
  <div class="layer" id="L-play"><div class="card" id="s-play"><div class="float"><div class="tile play"><span class="ring r1"></span><span class="ring r2"></span><svg width="42" height="42" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.6" fill="none" stroke="#310A3E" stroke-width="1.6"/><path d="M8.2 6.6v6.8l5.2-3.4z" fill="#310A3E"/></svg></div></div></div></div>
  <div class="layer" id="L-figma"><div class="card" id="s-figma"><div class="float"><div class="tile tool"><span class="ic"><img src="assets/figma.png" alt=""></span>Figma</div></div></div></div>
  <div class="layer" id="L-plus"><div class="card" id="s-plus"><div class="float"><div class="plus"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></div></div></div></div>
  <div class="layer" id="L-claude"><div class="card" id="s-claude"><div class="float"><div class="tile tool"><span class="ic"><img src="assets/claude.png" alt=""><span class="term">&gt;_</span></span>Claude Code</div></div></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  // ============================================================
  // CONFIG
  // ============================================================
  const REST = { '#back-a': -9, '#back-b': 9, '#hero': 0, '#s-kanji': -10, '#s-phrase': 6, '#s-ai': 4,
                 '#s-correct': -5, '#s-play': 0, '#s-figma': -3, '#s-plus': 0, '#s-claude': 3 };
  Object.entries(REST).forEach(([sel, r]) => gsap.set(sel, { rotate: r }));

  const CONFIG = {
    frame: { w: 1160, h: 1140 },
    margin: 0.9,
    ease: 'back.out(2.1)',
    duration: 0.65,
    leaveSpeed: 1.5,
    cards: [
      { el: '#hero-shadow', layer: '#L-hshadow', origin: '50% 50%', hover: { x: 0,   y: 16,  rotate: 0,   scale: 1.14 }, depth: 14, lean: 1 },
      { el: '#back-a',    layer: '#L-back-a',  origin: '80% 80%', hover: { x: -34, y: -12, rotate: -16, scale: 0.97 }, depth: -10, lean: 1.5 },
      { el: '#back-b',    layer: '#L-back-b',  origin: '20% 80%', hover: { x: 34,  y: -12, rotate: 16,  scale: 0.97 }, depth: -10, lean: 1.5 },
      { el: '#hero',      layer: '#L-hero',    origin: '50% 50%', hover: { x: 0,   y: -8,  rotate: 0,   scale: 1.04 }, depth: 14,  lean: 1 },
      { el: '#s-kanji',   layer: '#L-kanji',   origin: '50% 50%', hover: { x: -20, y: -14, rotate: -17, scale: 1.08 }, depth: 30,  lean: -2.5 },
      { el: '#s-phrase',  layer: '#L-phrase',  origin: '50% 50%', hover: { x: 20,  y: -14, rotate: 11,  scale: 1.07 }, depth: 26,  lean: 2.5 },
      { el: '#s-ai',      layer: '#L-ai',      origin: '50% 50%', hover: { x: 0,   y: -16, rotate: 9,   scale: 1.14 }, depth: 40,  lean: -3 },
      { el: '#s-correct', layer: '#L-correct', origin: '20% 50%', hover: { x: 22,  y: 6,   rotate: -10, scale: 1.08 }, depth: 32,  lean: 2 },
      { el: '#s-play',    layer: '#L-play',    origin: '50% 50%', hover: { x: -20, y: 4,   rotate: -8,  scale: 1.10 }, depth: 34,  lean: -2 },
      { el: '#s-figma',   layer: '#L-figma',   origin: '80% 50%', hover: { x: -12, y: 10,  rotate: -6,  scale: 1.06 }, depth: 22,  lean: -1.5 },
      { el: '#s-plus',    layer: '#L-plus',    origin: '50% 50%', hover: { x: 0,   y: 12,  rotate: 90,  scale: 1.15 }, depth: 24,  lean: 0 },
      { el: '#s-claude',  layer: '#L-claude',  origin: '20% 50%', hover: { x: 12,  y: 10,  rotate: 6,   scale: 1.06 }, depth: 22,  lean: 1.5 },
    ],
    extras(tl) {
      tl.fromTo('#hero-shadow .blob', { opacity: 0.75 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0)
        .fromTo('.glow', { scale: 1 }, { scale: 1.08, duration: 0.6, ease: 'power2.out' }, 0)
        // Story beats: the audio rings ripple out, the checks pop
        .fromTo('#s-play .r1', { scale: 1, opacity: 0.6 }, { scale: 1.25, opacity: 0.85, duration: 0.5, ease: 'power2.out' }, 0.1)
        .fromTo('#s-play .r2', { scale: 1, opacity: 0.3 }, { scale: 1.4, opacity: 0.5, duration: 0.6, ease: 'power2.out' }, 0.15)
        .fromTo('#kanji-check', { scale: 1 }, { scale: 1.3, duration: 0.25, ease: 'power2.out', yoyo: true, repeat: 1 }, 0.25)
        .fromTo('#correct-check', { scale: 1, rotate: 0 }, { scale: 1.25, rotate: -12, duration: 0.25, ease: 'power2.out', yoyo: true, repeat: 1, transformOrigin: '50% 50%' }, 0.3);
    },
  };

  // ============================================================
  // ENGINE (from the portfolio-promo-collage template)
  // ============================================================
  const { w: W, h: H } = CONFIG.frame;
  const stage = document.getElementById('stage');
  const params = new URLSearchParams(location.search);

  function fit() {
    const mode = params.get('fit') || 'contain';
    const margin = params.has('margin') ? parseFloat(params.get('margin')) : CONFIG.margin;
    const sx = innerWidth / W, sy = innerHeight / H;
    const base = mode === 'cover' ? Math.max(sx, sy) : mode === 'width' ? sx : mode === 'height' ? sy : Math.min(sx, sy);
    const s = base * margin;
    stage.style.transform = `translate(${-W * s / 2}px, ${-H * s / 2}px) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  function pivotLayers() {
    CONFIG.cards.forEach((c) => {
      const el = document.querySelector(c.el);
      const cx = el.offsetLeft + el.offsetWidth / 2, cy = el.offsetTop + el.offsetHeight / 2;
      gsap.set(c.layer, { transformOrigin: `${cx}px ${cy}px` });
      gsap.set(c.el, { transformOrigin: c.origin || '50% 50%' });
    });
  }
  pivotLayers();

  const tl = gsap.timeline({ paused: true });
  CONFIG.cards.forEach((c, i) => tl.to(c.el, { ...c.hover, duration: CONFIG.duration, ease: CONFIG.ease }, i * 0.03));
  CONFIG.extras(tl);

  const open = () => tl.timeScale(1).play();
  const close = () => tl.timeScale(CONFIG.leaveSpeed).reverse();

  const q = CONFIG.cards.map((c) => ({
    c,
    x: gsap.quickTo(c.layer, 'x', { duration: 0.6, ease: 'power3.out' }),
    y: gsap.quickTo(c.layer, 'y', { duration: 0.6, ease: 'power3.out' }),
    r: gsap.quickTo(c.layer, 'rotate', { duration: 0.8, ease: 'power3.out' }),
  }));
  function follow(e) {
    const nx = e.clientX / innerWidth - 0.5, ny = e.clientY / innerHeight - 0.5;
    q.forEach(({ c, x, y, r }) => { x(nx * c.depth); y(ny * c.depth); r(nx * c.lean); });
  }
  const settle = () => q.forEach(({ x, y, r }) => { x(0); y(0); r(0); });

  const root = document.documentElement;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (params.has('open')) {
    tl.progress(1);
  } else if (reduced) {
    root.addEventListener('pointerenter', () => tl.progress(1));
    root.addEventListener('pointerleave', () => tl.progress(0));
  } else {
    root.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') open(); });
    root.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { close(); settle(); } });
    root.addEventListener('pointermove',  (e) => { if (e.pointerType === 'mouse') follow(e); });
    document.addEventListener('mouseout', (e) => { if (!e.relatedTarget) { close(); settle(); } });
    root.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'mouse') (tl.reversed() || tl.progress() === 0) ? open() : close();
    });
    addEventListener('message', (e) => { if (e.data === 'hover:on') open(); if (e.data === 'hover:off') { close(); settle(); } });
  }
  if (params.has('t')) tl.pause().progress(parseFloat(params.get('t')));
  window.__tl = tl;
  window.__cfg = CONFIG;

  // Idle float at rest
  if (!reduced && !params.has('open') && !params.has('t')) {
    gsap.utils.toArray('.float').forEach((el, i) => {
      gsap.to(el, {
        y: i % 2 ? 4 : -4, rotate: i % 2 ? 0.6 : -0.6,
        duration: 2.6 + (i % 4) * 0.4, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: i * 0.23,
      });
    });
  }
})();
</script>
<script>
/* Click-through for embeds: ?href=<full page URL> makes the whole animation a link (&target=blank for a new tab). */
(() => {
  const p = new URLSearchParams(location.search), href = p.get('href');
  if (!href) return;
  const a = document.createElement('a');
  a.href = href;
  a.target = p.get('target') === 'blank' ? '_blank' : '_top';
  a.rel = 'noopener';
  a.setAttribute('aria-label', p.get('label') || 'Open case study');
  a.style.cssText = 'position:fixed;inset:0;z-index:2147483647;cursor:pointer;background:transparent;-webkit-tap-highlight-color:transparent';
  document.body.appendChild(a);
})();
</script>
</body>
</html>
