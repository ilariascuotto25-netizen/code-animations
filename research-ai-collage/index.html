<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Assistant Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     PROMO-COLLAGE TEMPLATE
     A Figma frame recomposed as a "promo" collage: a centred hero,
     tilted back cards fanned behind it, floating sticker cards and
     pills around it, a soft glow underneath.
     Motion: idle float at rest → hover fans the collage open
     (back cards tip out, hero lifts, stickers pop with spin)
     → every card follows the pointer at its own depth.
     Rule: anything purple/blurred (glow, hero shadow) lives on its
     own layer BEHIND all cards, and only transform/opacity animate.
     ============================================================ */
  :root {
    --purple: #6361f0;
    --sticker-shadow: 0 1px 2px rgba(29,27,58,.06), 0 14px 34px -10px rgba(52,40,140,.28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "DM Sans", system-ui, sans-serif; font-variation-settings: "opsz" 14; -webkit-font-smoothing: antialiased; cursor: default; }
  #stage { position: absolute; left: 50%; top: 50%; width: 979px; height: 669px; transform-origin: 0 0; }
  .layer { position: absolute; inset: 0; will-change: transform; pointer-events: none; }
  .card { position: absolute; will-change: transform; }
  .float { width: 100%; height: 100%; will-change: transform; }

  /* Soft two-tone glow behind the group — centre it under the hero */
  .glow {
    position: absolute; left: 185px; top: 60px; width: 700px; height: 490px; border-radius: 50%;
    background:
      radial-gradient(closest-side at 42% 50%, rgba(160,150,255,.55), rgba(160,150,255,0) 100%),
      radial-gradient(closest-side at 72% 70%, rgba(255,168,128,.32), rgba(255,168,128,0) 100%);
    filter: blur(24px);
  }

  /* Sticker surface: white card, hairline, lifted shadow (static — never animate box-shadow) */
  .sticker {
    width: 100%; height: 100%; background: #fff; border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(99,97,240,.14); box-shadow: var(--sticker-shadow);
  }
  .sticker img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* Hero: only a light neutral contact shadow on the card itself */
  #hero .sticker { border-radius: 22px; box-shadow: 0 2px 4px rgba(29,27,58,.06), 0 10px 24px -12px rgba(29,27,58,.18); }
  /* Hero's purple shadow: own layer behind everything. Size ≈ hero minus 40px wide, offset ~34px down */
  #hero-shadow .blob { width: 100%; height: 100%; border-radius: 40px; background: rgba(82,64,200,.42); filter: blur(28px); }

  /* Pill sticker (e.g. "✦ AI") */
  .pill {
    width: 100%; height: 100%; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: linear-gradient(135deg, #7c5cff, #6361f0 55%, #4f46e5);
    color: #fff; font-weight: 700; font-size: 18px; letter-spacing: .01em;
    box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 14px 30px -8px rgba(79,70,229,.6);
  }

  /* ---- Positions (stage px) — fill in per frame ---- */
  #hero-shadow { left: 426px; top: 111px; width: 218px; height: 456px; }
  #hero        { left: 406px; top: 77px; width: 258px; height: 460px; }
  #back-a      { left: 105px; top: 110px; width: 330px; height: 199px; }
  #back-b      { left: 645px; top: 98px; width: 210px; height: 246px; }
  #sticker-a   { left: 195px; top: 322px; width: 196px; height: 256px; }
  #sticker-b   { left: 713px; top: 384px; width: 168px; height: 70px; }
  #pill        { left: 80px; top: 86px; width: 92px;  height: 40px; }
  #hero .sticker { border-radius: 18px; }
  /* Mobbin → Claude badge */
  .badge { width: 100%; height: 100%; background: #fff; border-radius: 22px; border: 1px solid rgba(99,97,240,.14); box-shadow: var(--sticker-shadow);
           display: flex; align-items: center; justify-content: center; gap: 10px; }
  .badge img.logo { width: 46px; height: 46px; border-radius: 12px; display: block; }
  .badge img.arrow { width: 24px; height: 12px; display: block; }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="AI assistant research collage: Unify's AI Research panel at the centre, surrounded by Deel, Wrangle and Pipedrive AI assistant screens, and a Mobbin to Claude badge.">

  <div class="glow" aria-hidden="true"></div>

  <!-- DOM order = paint order. Shadow first, then back cards, hero, stickers. -->
  <div class="layer" id="L-hshadow"><div class="card" id="hero-shadow"><div class="blob"></div></div></div>

  <div class="layer" id="L-back-a"><div class="card" id="back-a"><div class="float"><div class="sticker"><img src="assets/deel.png" alt=""></div></div></div></div>
  <div class="layer" id="L-back-b"><div class="card" id="back-b"><div class="float"><div class="sticker"><img src="assets/wrangle.png" alt=""></div></div></div></div>

  <div class="layer" id="L-hero"><div class="card" id="hero"><div class="float"><div class="sticker"><img src="assets/unify.png" alt=""></div></div></div></div>

  <div class="layer" id="L-sticker-a"><div class="card" id="sticker-a"><div class="float"><div class="sticker"><img src="assets/pipedrive.png" alt=""></div></div></div></div>
  <div class="layer" id="L-sticker-b"><div class="card" id="sticker-b"><div class="float"><div class="badge"><img class="logo" id="mobbin" src="assets/mobbin-logo.png" alt=""><img class="arrow" id="arrow" src="assets/arrow.svg" alt=""><img class="logo" id="claude" src="assets/claude-logo.png" alt=""></div></div></div></div>
  <div class="layer" id="L-pill"><div class="card" id="pill"><div class="float"><div class="pill">✦ AI</div></div></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  // ============================================================
  // CONFIG — the only part that changes between frames
  // ============================================================
  // Rest tilts create the fanned promo look (hero stays at 0; alternate signs around it, ±3–8°)
  const REST = { '#back-a': -6, '#back-b': 5, '#hero': 0, '#sticker-a': -5, '#sticker-b': 4, '#pill': -8 };
  Object.entries(REST).forEach(([sel, r]) => gsap.set(sel, { rotate: r }));

  const CONFIG = {
    frame: { w: 979, h: 669 },
    margin: 0.9,
    ease: 'back.out(2.1)',
    duration: 0.65,
    leaveSpeed: 1.5,
    // hover.rotate is the absolute tilt on hover (≈ rest tilt × 1.8, same sign).
    // depth: back −10, hero 14, stickers 26–40 (closest moves most). lean: same sign as tilt direction you want.
    cards: [
      { el: '#hero-shadow', layer: '#L-hshadow', origin: '50% 50%', hover: { x: 0, y: 16, rotate: 0, scale: 1.12 }, depth: 14, lean: 1 },
      { el: '#back-a',    layer: '#L-back-a',    origin: '85% 50%', hover: { x: -28, y: -12, rotate: -10, scale: 0.97 }, depth: -10, lean: 1.5 },
      { el: '#back-b',    layer: '#L-back-b',    origin: '15% 50%', hover: { x: 26,  y: -14, rotate: 9,   scale: 0.97 }, depth: -10, lean: 1.5 },
      { el: '#hero',      layer: '#L-hero',      origin: '50% 50%', hover: { x: 0,   y: -6,  rotate: 0,   scale: 1.04 }, depth: 14,  lean: 1 },
      { el: '#sticker-a', layer: '#L-sticker-a', origin: '80% 20%', hover: { x: -20, y: 14,  rotate: -9,  scale: 1.05 }, depth: 26,  lean: -2.5 },
      { el: '#sticker-b', layer: '#L-sticker-b', origin: '20% 50%', hover: { x: 18,  y: 14,  rotate: 8,   scale: 1.08 }, depth: 34,  lean: 3 },
      { el: '#pill',      layer: '#L-pill',      origin: '50% 50%', hover: { x: -12, y: -14, rotate: -13, scale: 1.12 }, depth: 40,  lean: -3 },
    ],
    extras(tl) {
      tl.fromTo('#hero-shadow .blob', { opacity: 0.75 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0)
        .fromTo('.glow', { scale: 1 }, { scale: 1.08, duration: 0.6, ease: 'power2.out' }, 0);
      // Story beat: research flows from Mobbin into Claude — the arrow nudges across, Claude's starburst spins
      tl.fromTo('#arrow', { x: 0 }, { keyframes: { x: [0, 5, 2] }, duration: 0.6, ease: 'power2.out' }, 0.15)
        .fromTo('#claude', { rotate: 0 }, { rotate: 90, duration: 0.7, ease: 'back.out(1.8)' }, 0.25)
        .fromTo('#mobbin', { scale: 1 }, { keyframes: { scale: [1, 0.92, 1] }, duration: 0.35, ease: 'power1.inOut' }, 0.05);
    },
  };

  // ============================================================
  // ENGINE — reusable, no edits needed
  // ============================================================
  const { w: W, h: H } = CONFIG.frame;
  const stage = document.getElementById('stage');
  const params = new URLSearchParams(location.search);

  // Sizing inside the embed. ?fit=contain (default: whole frame visible) | width (fill the width)
  // | height | cover (fill the box, may crop). ?margin=1 removes the breathing room (default CONFIG.margin).
  function fit() {
    const mode = params.get('fit') || 'contain';
    const margin = params.has('margin') ? parseFloat(params.get('margin')) : CONFIG.margin;
    const sx = innerWidth / W, sy = innerHeight / H;
    const base = mode === 'cover' ? Math.max(sx, sy) : mode === 'width' ? sx : mode === 'height' ? sy : Math.min(sx, sy);
    const s = base * margin;
    stage.style.transform = `translate(${-W * s / 2}px, ${-H * s / 2}px) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  // Layers pivot around their card's centre for the pointer lean
  function pivotLayers() {
    CONFIG.cards.forEach((c) => {
      const el = document.querySelector(c.el);
      const cx = el.offsetLeft + el.offsetWidth / 2, cy = el.offsetTop + el.offsetHeight / 2;
      gsap.set(c.layer, { transformOrigin: `${cx}px ${cy}px` });
      gsap.set(c.el, { transformOrigin: c.origin || '50% 50%' });
      if (c.shadow) gsap.set(c.el, { filter: c.shadow.rest });
    });
  }
  pivotLayers();

  const tl = gsap.timeline({ paused: true });
  CONFIG.cards.forEach((c, i) => {
    tl.to(c.el, { ...c.hover, duration: CONFIG.duration, ease: CONFIG.ease }, i * 0.03);
    if (c.shadow) tl.to(c.el, { filter: c.shadow.hover, duration: CONFIG.duration - 0.15, ease: 'power2.out' }, i * 0.03);
  });
  CONFIG.extras(tl);

  const open = () => tl.timeScale(1).play();
  const close = () => tl.timeScale(CONFIG.leaveSpeed).reverse();

  // Pointer parallax + lean (eased follow)
  const q = CONFIG.cards.map((c) => ({
    c,
    x: gsap.quickTo(c.layer, 'x', { duration: 0.6, ease: 'power3.out' }),
    y: gsap.quickTo(c.layer, 'y', { duration: 0.6, ease: 'power3.out' }),
    r: gsap.quickTo(c.layer, 'rotate', { duration: 0.8, ease: 'power3.out' }),
  }));
  function follow(e) {
    const nx = e.clientX / innerWidth - 0.5, ny = e.clientY / innerHeight - 0.5;   // -0.5…0.5
    q.forEach(({ c, x, y, r }) => { x(nx * c.depth); y(ny * c.depth); r(nx * c.lean); });
  }
  const settle = () => q.forEach(({ x, y, r }) => { x(0); y(0); r(0); });

  const root = document.documentElement;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (params.has('open')) {
    tl.progress(1);
  } else if (reduced) {
    root.addEventListener('pointerenter', () => tl.progress(1));
    root.addEventListener('pointerleave', () => tl.progress(0));
  } else {
    root.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') open(); });
    root.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { close(); settle(); } });
    root.addEventListener('pointermove',  (e) => { if (e.pointerType === 'mouse') follow(e); });
    // Backup for browsers that miss pointerleave on fast exits from an iframe
    document.addEventListener('mouseout', (e) => { if (!e.relatedTarget) { close(); settle(); } });
    // Touch has no hover: a tap toggles
    root.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'mouse') (tl.reversed() || tl.progress() === 0) ? open() : close();
    });
    // A host page can forward its own hover state: postMessage('hover:on' | 'hover:off')
    addEventListener('message', (e) => { if (e.data === 'hover:on') open(); if (e.data === 'hover:off') { close(); settle(); } });
  }
  if (params.has('t')) tl.pause().progress(parseFloat(params.get('t')));
  window.__tl = tl;
  window.__cfg = CONFIG;

  // ---------- Idle float at rest: each card bobs gently, out of phase ----------
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !params.has('open') && !params.has('t')) {
    gsap.utils.toArray('.float').forEach((el, i) => {
      gsap.to(el, {
        y: i % 2 ? 4 : -4, rotate: i % 2 ? 0.6 : -0.6,
        duration: 2.6 + (i % 4) * 0.4, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: i * 0.23,
      });
    });
  }
})();
</script>
</body>
</html>
